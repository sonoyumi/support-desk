<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Поддержка{% endblock %} · {{ company }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if me %}
<header class="top">
  <a class="brand" href="/tickets">🎧 {{ company }}</a>
  <nav>
    <a href="/tickets" class="{{ 'on' if active == 'tickets' }}">Обращения</a>
    <a href="/stats" class="{{ 'on' if active == 'stats' }}">Статистика</a>
    <a href="/canned" class="{{ 'on' if active == 'canned' }}">Шаблоны</a>
  </nav>
  <form method="post" action="/logout" class="who">
    <span>{{ me['name'] }}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">Выйти</button>
  </form>
</header>
{% endif %}
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
